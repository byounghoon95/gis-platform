spring:
  application:
    name: gis-platform-backend
  profiles:
    default: local
  jpa:
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    jwt-secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-32chars}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    admin-email: ${ADMIN_EMAIL:admin@example.com}
    admin-password: ${ADMIN_PASSWORD:admin1234}
    admin-name: ${ADMIN_NAME:Admin}
