services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: gis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis_platform}
      POSTGRES_USER: ${POSTGRES_USER:-gis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gis_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: gis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${BACKEND_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gis_platform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gis_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-gis_password}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-32chars}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: alpine:3.20
    container_name: gis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command:
      - sh
      - -c
      - |
        echo "Frontend placeholder waiting for React/Vite implementation."
        echo "API base URL: $${VITE_API_BASE_URL}"
        tail -f /dev/null

volumes:
  postgres-data:
